<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0F3D3A">
    <meta name="description" content="Acesse sua conta Syst Team.">

    <title>Syst Team | Acesse sua conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.27/dist/lenis.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js" defer></script>
</head>

<body>

    <main class="auth-layout">

        <!-- VOLTAR -->
        <a href="../index.html" class="back-link">
            <svg class="back-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
            </svg>
            <span>Voltar ao site</span>
        </a>

        <!-- CARD PRINCIPAL -->
        <section class="auth-card">

            <!-- HEADER -->
            <header class="auth-header">
                <div class="logo-wrapper">
                    <img src="../assets/Syst_Logo.webp" alt="Syst Team" class="auth-logo">
                </div>

                <div class="brand-label">
                    <span class="status-dot"></span>
                    CONTA SYST TEAM
                </div>

                <h1 class="auth-title">
                    Sua conta <span>Syst.</span>
                </h1>

                <p class="auth-subtitle">
                    Entre ou crie sua conta para avaliar seu projeto.
                </p>
            </header>

            <!-- ABAS -->
            <div class="auth-tabs" role="tablist">
                <button
                    class="tab-btn active"
                    id="tab-login"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="form-login">
                    Entrar
                </button>

                <button
                    class="tab-btn"
                    id="tab-register"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    aria-controls="form-register">
                    Criar conta
                </button>
            </div>

            <!-- ALERTAS -->
            <div id="auth-alert" class="alert-box" style="display: none;" role="alert"></div>

            <!-- ==========================
                 LOGIN
            =========================== -->
            <form id="form-login" class="auth-form" onsubmit="handleAuthSubmit(event, 'login')">

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="login-email">E-mail</label>
                    <div class="input-wrapper login-email-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                        </span>

                        <input
                            type="email"
                            id="login-email"
                            required
                            placeholder="nome@exemplo.com"
                            autocomplete="email">

                        <!-- AVATAR -->
                        <div class="login-avatar-container" id="login-avatar-container" title="Prévia do perfil">
                            <span id="login-avatar-initial">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <img id="login-avatar" alt="Foto de perfil">
                        </div>
                    </div>
                </div>

                <!-- SENHA -->
                <div class="form-group">
                    <label for="login-password">Senha</label>
                    <div class="input-wrapper password-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>

                        <input
                            type="password"
                            id="login-password"
                            required
                            placeholder="Sua senha"
                            autocomplete="current-password">

                        <button type="button" class="toggle-password-btn" data-target="login-password" aria-label="Mostrar senha">
                            <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                                <line x1="2" x2="22" y1="2" y2="22"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- BOTÃO -->
                <button type="submit" class="btn-submit">
                    <span>Entrar na conta</span>
                    <svg class="button-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <!-- ==========================
                 CADASTRO
            =========================== -->
            <form id="form-register" class="auth-form" style="display: none;" onsubmit="handleAuthSubmit(event, 'register')">

                <!-- NOMES -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-firstname">Primeiro nome</label>
                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input
                                type="text"
                                id="reg-firstname"
                                required
                                placeholder="João"
                                autocomplete="given-name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-lastname">Sobrenome</label>
                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                </svg>
                            </span>
                            <input
                                type="text"
                                id="reg-lastname"
                                required
                                placeholder="Silva"
                                autocomplete="family-name">
                        </div>
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="reg-email">E-mail</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                        </span>
                        <input
                            type="email"
                            id="reg-email"
                            required
                            placeholder="nome@exemplo.com"
                            autocomplete="email">
                    </div>
                </div>

                <!-- SENHA -->
                <div class="form-group">
                    <label for="reg-password">Senha</label>
                    <div class="input-wrapper password-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>

                        <input
                            type="password"
                            id="reg-password"
                            required
                            minlength="10"
                            placeholder="Mínimo de 10 caracteres"
                            autocomplete="new-password">

                        <button type="button" class="toggle-password-btn" data-target="reg-password" aria-label="Mostrar senha">
                            <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                                <line x1="2" x2="22" y1="2" y2="22"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- BOTÃO -->
                <button type="submit" class="btn-submit">
                    <span>Criar minha conta</span>
                    <svg class="button-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <!-- FOOTER -->
            <footer class="auth-footer">
                <span>© 2026 Syst Team</span>
                <span class="footer-separator">·</span>
                <span>Feito para criar.</span>
            </footer>

        </section>

        <!-- DECORAÇÃO -->
        <div class="bottom-decoration">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </main>

    <!-- APP PRINCIPAL -->
    <script src="../app.js"></script>

    <!-- CONTROLE DAS ABAS E VISUALIZAÇÃO DE SENHA -->
    <script>
        /* Alternar abas Login / Cadastro */
        function switchTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const alertBox = document.getElementById('auth-alert');

            const isLogin = tab === 'login';

            loginTab.classList.toggle('active', isLogin);
            registerTab.classList.toggle('active', !isLogin);

            loginTab.setAttribute('aria-selected', isLogin);
            registerTab.setAttribute('aria-selected', !isLogin);

            formLogin.style.display = isLogin ? 'flex' : 'none';
            formRegister.style.display = isLogin ? 'none' : 'flex';

            alertBox.style.display = 'none';
            alertBox.textContent = '';
            alertBox.className = 'alert-box';
        }

        document.getElementById('tab-login').addEventListener('click', () => switchTab('login'));
        document.getElementById('tab-register').addEventListener('click', () => switchTab('register'));

        /* Alternar visibilidade da senha */
        document.querySelectorAll('.toggle-password-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                if (!input) return;

                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';

                const eyeOpen = btn.querySelector('.eye-open');
                const eyeClosed = btn.querySelector('.eye-closed');

                eyeOpen.style.display = isPassword ? 'none' : 'block';
                eyeClosed.style.display = isPassword ? 'block' : 'none';
                btn.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.3.27/dist/lenis.min.js"></script>
    <script src="../js/motion.js"></script>

</body>
</html>
