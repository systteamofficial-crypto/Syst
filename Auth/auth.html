
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F3D3A">
    <meta name="description" content="Acesse sua conta Syst Team.">

    <title>Syst Team | Acesse sua conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.27/dist/lenis.css">

    <!-- Biblioteca necessária para gerar o hash do Gravatar -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"
        defer>
    </script>

</head>

<body>

    <main class="auth-layout">

        <!-- VOLTAR -->
        <a href="../index.html" class="back-link">
            <span class="back-icon">←</span>
            Voltar ao site
        </a>

        <!-- CARD PRINCIPAL -->
        <section class="auth-card">

            <!-- HEADER -->
            <header class="auth-header">

                <div class="logo-wrapper">
                    <img
                        src="../Syst_Logo.png"
                        alt="Syst Team"
                        class="auth-logo">
                </div>

                <div class="brand-label">
                    <span class="status-dot"></span>
                    SYST TEAM ACCOUNT
                </div>

                <h1 class="auth-title">
                    Seu espaço.<br>
                    <span>Suas ideias.</span>
                </h1>

                <p class="auth-subtitle">
                    Entre na sua conta e continue de onde parou.
                </p>

            </header>

            <!-- ABAS -->
            <div class="auth-tabs" role="tablist">

                <button
                    class="tab-btn active"
                    id="tab-login"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="form-login">

                    Entrar

                </button>

                <button
                    class="tab-btn"
                    id="tab-register"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    aria-controls="form-register">

                    Criar conta

                </button>

            </div>

            <!-- ALERTAS -->
            <div
                id="auth-alert"
                class="alert-box"
                style="display: none;"
                role="alert">
            </div>

            <!-- ==========================
                 LOGIN
            =========================== -->

            <form
                id="form-login"
                class="auth-form"
                onsubmit="handleAuthSubmit(event, 'login')">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="login-email">
                        E-mail
                    </label>

                    <div class="input-wrapper login-email-wrapper">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="login-email"
                            required
                            placeholder="nome@exemplo.com"
                            autocomplete="email">

                        <!-- AVATAR -->
                        <div
                            class="login-avatar-container"
                            id="login-avatar-container">

                            <span id="login-avatar-initial">?</span>

                            <img
                                id="login-avatar"
                                alt="Foto de perfil">

                        </div>

                    </div>

                </div>

                <!-- SENHA -->
                <div class="form-group">

                    <label for="login-password">
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">⌑</span>

                        <input
                            type="password"
                            id="login-password"
                            required
                            placeholder="Sua senha"
                            autocomplete="current-password">

                    </div>

                </div>

                <!-- BOTÃO -->
                <button type="submit" class="btn-submit">

                    <span>Entrar na conta</span>

                    <span class="button-arrow">→</span>

                </button>

            </form>

            <!-- ==========================
                 CADASTRO
            =========================== -->

            <form
                id="form-register"
                class="auth-form"
                style="display: none;"
                onsubmit="handleAuthSubmit(event, 'register')">

                <!-- NOMES -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="reg-firstname">
                            Primeiro nome
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="text"
                                id="reg-firstname"
                                required
                                placeholder="João"
                                autocomplete="given-name">

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="reg-lastname">
                            Sobrenome
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="text"
                                id="reg-lastname"
                                required
                                placeholder="Silva"
                                autocomplete="family-name">

                        </div>

                    </div>

                </div>

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="reg-email">
                        E-mail
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="reg-email"
                            required
                            placeholder="nome@exemplo.com"
                            autocomplete="email">

                    </div>

                </div>

                <!-- SENHA -->
                <div class="form-group">

                    <label for="reg-password">
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="reg-password"
                            required
                            minlength="10"
                            placeholder="Mínimo de 10 caracteres"
                            autocomplete="new-password">

                    </div>

                </div>

                <!-- BOTÃO -->
                <button type="submit" class="btn-submit">

                    <span>Criar minha conta</span>

                    <span class="button-arrow">→</span>

                </button>

            </form>

            <!-- FOOTER -->
            <footer class="auth-footer">

                <span>© 2026 Syst Team</span>

                <span class="footer-separator">·</span>

                <span>Feito para criar.</span>

            </footer>

        </section>

        <!-- DECORAÇÃO -->
        <div class="bottom-decoration">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </main>

    <!-- APP PRINCIPAL -->
    <script src="../app.js"></script>

    <!-- CONTROLE DAS ABAS E AVATAR -->
    <script>

        /* ==================================
           ALTERNAR LOGIN / CADASTRO
        ================================== */

        function switchTab(tab) {

            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');

            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');

            const alertBox = document.getElementById('auth-alert');

            const isLogin = tab === 'login';

            loginTab.classList.toggle('active', isLogin);
            registerTab.classList.toggle('active', !isLogin);

            loginTab.setAttribute('aria-selected', isLogin);
            registerTab.setAttribute('aria-selected', !isLogin);

            formLogin.style.display = isLogin ? 'flex' : 'none';
            formRegister.style.display = isLogin ? 'none' : 'flex';

            alertBox.style.display = 'none';
            alertBox.textContent = '';
            alertBox.className = 'alert-box';
        }

        document.getElementById('tab-login').addEventListener(
            'click',
            () => switchTab('login')
        );

        document.getElementById('tab-register').addEventListener(
            'click',
            () => switchTab('register')
        );



    </script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.3.27/dist/lenis.min.js"></script>
    <script src="../js/motion.js"></script>

</body>
</html>
